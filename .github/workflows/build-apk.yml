name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Lock the game to landscape
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Copy game into the app
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: FuryFists-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
